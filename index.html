<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/style.css">
    <title>Anime or Sage</title>
</head>

<body class="container-lg d-flex flex-column align-items-center justify-content-center vh-100 vw-100">
    <!-- Blurry background for container to enhance visibility -->
    <div class="blur d-flex flex-column align-items-center justify-content-center">
        <h1>Anime or Sage</h1>
        <h2>Was this quote from an anime character or a wise man/woman in history?</h2>
        <a href="https://github.com/tremckinley/anime-sage"><img src="./assets/images/github.svg" alt="github logo" height="30"/></a>
        <!-- Quote -->
        <p id="quote"></p>
        <!-- Buttons -->
        <div id="button-container" class="w-100 justify-content-center align-items-center">
            <button id="anime" class="answer btn btn-dark border-light">Anime</button>
            <span class="or">OR</span>
            <button id="sage" class="answer btn btn-light border-dark">Sage</button>
        </div>
        <div id="result-container" class="align-items-center justify-content-center">
            <!-- Correct or Incorrect -->
            <p id="result"></p>

        </div>
        <!-- Restart Button -->
        <button id="restart" class="btn btn-primary m-2">Restart</button>
    </div>
    <!-- Modal -->
    <div class="modal fade" id="modal" tabindex="-1" aria-labelledby="modal-title" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-title">Quote Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="modal-info"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="modal-restart">Restart</button>
                </div>
            </div>
        </div>
    </div>
    <!-- End Modal -->
</body>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- Script -->
    <script src="assets/script.js"></script>

</html>
